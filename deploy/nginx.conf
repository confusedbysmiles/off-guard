# Off-Guard behind nginx.
#
# Include this inside the `server { }` block of a host that already terminates
# TLS. It is written for a subdirectory install -- drseim.com/off-guard -- which
# is the harder of the two cases; see the note at the bottom for a whole host.
#
#   include /srv/off-guard/deploy/nginx.conf;
#
# Set OFF_GUARD_BASE_PATH=/off-guard in the service so the application generates
# the same paths nginx forwards. The prefix is *not* stripped: the application
# is told where it lives and answers on those paths itself, which keeps one
# source of truth for the URL shape instead of two that can drift.

location /off-guard/ {
    proxy_pass http://127.0.0.1:8787;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The failure counter that defends against token guessing keys on the
    # client address. Without this every attempt looks like it came from nginx
    # and one guesser locks out the whole table.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Server-Sent Events ------------------------------------------------
    #
    # The shared screen holds one long-lived response open and is fed a few
    # hundred bytes at a time. Buffering it means the television updates in
    # batches minutes apart, which looks exactly like the application being
    # broken. The app sets `X-Accel-Buffering: no` as well; this is the belt.
    proxy_buffering off;
    proxy_cache off;
    # A fight can sit quiet for a long time between turns. The stream sends a
    # heartbeat comment, but the timeout has to outlast a slow round anyway.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # A Pathbuilder export is the largest thing anyone uploads, and it is small.
    client_max_body_size 2m;
}

# The token is the credential and it is in the path, so it must not reach the
# access log. Turning logging off for this location is blunt but correct: an
# access log line here is a credential written to disk in cleartext, rotated
# and often shipped.
#
# If you want request volume without the paths, log to a format that omits
# $request and $uri entirely:
#
#   log_format off_guard_safe '$remote_addr $status $body_bytes_sent $request_time';
#   access_log /var/log/nginx/off-guard.log off_guard_safe;
#
location = /off-guard {
    return 301 /off-guard/;
}

# Crawlers, at the host root, where they actually look. The application serves
# its own /off-guard/robots.txt too, but a subdirectory install cannot answer
# for the root of a domain it shares -- so if this host is Off-Guard's alone,
# this is the line that matters.
#
#   location = /robots.txt {
#       add_header Content-Type text/plain;
#       return 200 "User-agent: *\nDisallow: /off-guard/\n";
#   }

# --- Serving a whole host instead ------------------------------------------
#
# Leave OFF_GUARD_BASE_PATH unset and use:
#
#   location / {
#       proxy_pass http://127.0.0.1:8787;
#       ... the same proxy_set_header and SSE lines as above ...
#   }
#
# Nothing in the browser changes: the pages work their mount point out from
# their own address.
