<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1A1033">
<!-- The token is in the URL and must not be here: no title, no og: tag, and
     nothing else that names the character before the sheet has loaded. -->
<title>Character sheet</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/sheet.css">
<link rel="stylesheet" href="../assets/css/print.css" media="print">
</head>
<body>
<a class="skip-link" href="#sheet">Skip to the sheet</a>

<header class="sheet-bar">
  <div class="sheet-bar__identity">
    <span class="sheet-bar__campaign" id="campaign-name"></span>
    <h1 class="sheet-bar__name" id="character-name">Loading…</h1>
  </div>
  <div class="sheet-bar__tools">
    <output class="save-state" id="save-state" aria-live="polite"></output>
    <!-- A button rather than a link: an href would put the token into the
         markup, which is the one thing every page here is careful not to do. -->
    <button class="btn" id="build" type="button">Build</button>
    <button class="btn btn--icon btn--quiet" id="undo" type="button" disabled>
      <span class="sr-only">Undo last change</span>
    </button>
    <button class="btn btn--icon btn--quiet" id="theme" type="button" aria-pressed="false">
      <span class="sr-only">Switch to the light theme</span>
    </button>
    <button class="btn btn--icon btn--quiet" id="print" type="button">
      <span class="sr-only">Print this sheet</span>
    </button>
  </div>
</header>

<div class="notices" id="notices" role="status" aria-live="polite"></div>

<main id="sheet" class="sheet" tabindex="-1">
  <p class="sheet__loading" id="loading">Loading your character…</p>
</main>

<dialog class="modal" id="import-dialog" aria-labelledby="import-title">
  <form method="dialog" class="modal__form">
    <h2 id="import-title">Import from Pathbuilder</h2>
    <div id="import-body"></div>
    <menu class="modal__actions">
      <button class="btn" value="cancel" type="submit">Cancel</button>
      <button class="btn btn--primary" id="import-confirm" value="confirm" type="submit" disabled>
        Apply selected changes
      </button>
    </menu>
  </form>
</dialog>

<footer class="sheet-footer">
  <p class="faint" id="licence-note"></p>
</footer>

<script type="module" src="../assets/js/sheet/main.js"></script>
</body>
</html>
