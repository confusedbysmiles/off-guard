<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1A1033">
<!-- The token is in the URL and must not be here: no title, no og: tag, and
     nothing else that names the character before the page has loaded. -->
<title>Character builder</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/build.css">
</head>
<body>
<a class="skip-link" href="#timeline">Skip to the timeline</a>

<header class="build-bar">
  <!-- The page's heading, not the character's: the name is an editable field
       here, and a heading you can type into is neither. -->
  <h1 class="sr-only">Character builder</h1>
  <div class="build-bar__identity">
    <label class="sr-only" for="name">Character name</label>
    <input class="input build-bar__name" id="name" type="text" placeholder="Name your character"
           autocomplete="off" spellcheck="false">
    <output class="build-bar__outstanding" id="outstanding" aria-live="polite"></output>
  </div>

  <!-- Two fixed rows rather than whatever flex-wrap decided: the bar is sticky,
       so a layout that changes height as the name grows moves the whole page. -->
  <div class="build-bar__meta">
    <div class="field field--inline">
      <label class="field__label" for="level">Level</label>
      <input class="input input--number" id="level" type="number" min="1" max="20" step="1">
    </div>
    <div class="field field--inline">
      <label class="field__label" for="plan-to">Plan to</label>
      <input class="input input--number" id="plan-to" type="number" min="1" max="20" step="1">
    </div>
    <!-- Equipment is not a level choice and so is not in the timeline, which
         at level 12 puts it a long way down a long page. This is how you get
         there. -->
    <nav class="build-bar__jump" aria-label="Jump to a section">
      <a class="jump" href="#timeline">Levels</a>
      <a class="jump" href="#equipment">Equipment</a>
      <a class="jump" href="#summary">Summary</a>
    </nav>
  </div>

  <div class="build-bar__tools">
    <output class="save-state" id="save-state" aria-live="polite"></output>
    <button class="btn" id="play" type="button">Play</button>
    <button class="btn btn--icon btn--quiet" id="theme" type="button" aria-pressed="false">
      <span class="sr-only">Switch to the light theme</span>
    </button>
  </div>
</header>

<div class="notices" id="notices" role="status" aria-live="polite"></div>

<main class="build">
  <div class="build__timeline" id="timeline" tabindex="-1">
    <p class="build__loading" id="loading">Loading your character…</p>
  </div>
  <!-- Not part of the timeline: equipment is not a level choice. Two cards go
       in here, and both are built by `build/equipment.js`. -->
  <div class="build__equipment" id="equipment" tabindex="-1"></div>
  <aside class="build__summary" id="summary" tabindex="-1" aria-label="Current character"></aside>
</main>

<dialog class="modal modal--picker" id="picker-dialog" aria-labelledby="picker-title"></dialog>

<script type="module" src="../assets/js/build/main.js"></script>
</body>
</html>
